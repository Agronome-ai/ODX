name: Build PRs

# AGRONOME FORK EDIT — the only change to this inherited upstream file.
#
# Upstream runs these three full SuperBuilds (linux, GPU, Windows) on every PR. In this
# fork that is hours of runner time per PR for artifacts nobody consumes: we ship
# engine-odx-agronome as a thin four-file COPY overlay on a pre-built image, never a
# source build. Our PRs target agronome/dji-m3m-multispectral, so restricting the
# trigger to master stops them firing on our work while keeping the source-build signal
# exactly where it still means something — the branch that tracks upstream verbatim.
#
# Our own coverage is .github/workflows/agronome-ci.yml (overlay assertion + ODX's
# unittest suite, which upstream CI never runs at all).
#
# Deliberately a 2-line trigger edit rather than deleting the file: a small conflict on
# an upstream rebase is cheaper to resolve than a whole-file delete, and keeps the
# workflow available on master.
on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Build
      uses: docker/build-push-action@v2
      with:
        file: ./portable.Dockerfile
        platforms: linux/amd64
        push: false
  
  docker_gpu:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Build
      uses: docker/build-push-action@v2
      with:
        file: ./gpu.Dockerfile
        platforms: linux/amd64
        push: false
  
  windows:
    runs-on: windows-2022
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Setup Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12.9'
        architecture: 'x64'
    - uses: Jimver/cuda-toolkit@v0.2.35
      id: cuda-toolkit
      with:
        cuda: '12.8.1'
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v1.13
      with:
        cmake-version: '3.28.x'
    - name: Install venv
      run: |
        python -m pip install virtualenv
    - name: Build sources
      run: |
        python configure.py build --postpip "${{ secrets.POSTPIP }}"
    - name: Free up space
      run: |
        rmdir SuperBuild\download /s /q
        rmdir SuperBuild\build /s /q
      shell: cmd
    - name: Create setup
      run: |
        python configure.py dist
    - name: Upload Setup File
      uses: actions/upload-artifact@v4
      with:
        name: Setup
        path: dist\*.exe
